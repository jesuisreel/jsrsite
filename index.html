const $=id=>document.getElementById(id);
const VIEW=$('view');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nrm=s=>String(s).toLowerCase().replace(/ё/g,'е');
const IMG=/^(https?:\/\/\S+\.(png|jpe?g|gif|webp)(\?\S*)?|images\/\S+)$/i;
const isNum=t=>/^-?[\d\s.,]+%?$/.test(String(t).trim())&&/\d/.test(t);
const isTxt=t=>String(t).trim()&&!isNum(t);
const keyOf=t=>String(t).replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim();
const colL=n=>{let s='';n++;while(n){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26)}return s};
function fmt(t){t=String(t).trim();if(/^-?\d+\.\d{3,}$/.test(t))return String(+(+t).toFixed(2));return t}
function cell(t){t=fmt(t);if(!t)return'';
  // [img:папка/имя] -> рамка под картинку images/папка/имя.png
  var im=/^\[img:([^\/\]]+)\/(.+)\]$/.exec(t);
  if(im)return slotH(im[1],im[2],{h:80});
  if(IMG.test(t))return'<img loading="lazy" src="'+encodeURI(t)+'">';
  // Сначала превращаем markdown-ссылки в HTML (экранируя текст)
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Затем обрабатываем обычный текст и остальные голые ссылки, не трогая уже созданные теги <a>
  return t.split(/(<a[^>]*>.*?<\/a>)/g).map(part => {
      if (part.startsWith('<a')) return part;
      return esc(part).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  }).join('');
}
function trim(rows){
  let w=0;rows.forEach(r=>r.forEach((c,i)=>{if(String(c).trim())w=Math.max(w,i+1)}));
  let h=rows.length;while(h&&!rows[h-1].some(c=>String(c).trim()))h--;
  return rows.slice(0,h).map(r=>r.slice(0,w))}
const isBlankRow=r=>!r.some(c=>String(c).trim());
const firstTxt=r=>{for(const c of r){const t=String(c).trim();if(t)return t.replace(/\s+/g,' ').slice(0,70)}return''};

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadSlot(e.target)}}),{rootMargin:'400px'});
function loadSlot(el){const ex=el.dataset.x.split(',');let k=0;const img=new Image();img.alt='';
  const p=k=>'images/'+el.dataset.f+'/'+encodeURIComponent(el.dataset.k)+'.'+ex[k];
  img.onload=()=>{el.appendChild(img);el.classList.add('ok')};
  img.onerror=()=>{k++;if(k<ex.length)img.src=p(k);else el.classList.add('miss')};
  img.src=p(0)}
function hydrate(root){root.querySelectorAll('.slot:not([data-h])').forEach(el=>{el.dataset.h=1;
  const path='images/'+el.dataset.f+'/'+el.dataset.k+'.'+el.dataset.x.split(',')[0];
  el.title=path;el.innerHTML='<span class="sl-l"><i>🖼</i><small>'+esc(el.classList.contains('band')?path:el.dataset.k)+'</small></span>';

function planGrid(rows,o){
  const W=Math.max(...rows.map(r=>r.length));const items=[];let r=0;
  while(r<rows.length){const a=r;const bl=isBlankRow(rows[r]);while(r<rows.length&&isBlankRow(rows[r])===bl)r++;
    items.push(bl?{t:'g',a,b:r-1,L:r-a}:{t:'b',a,b:r-1})}
  const mk=(c,span,own)=>({c,span,own});
  items.forEach(it=>{if(it.t!=='b')return;
    const cols=[];for(let c=0;c<W;c++)for(let q=it.a;q<=it.b;q++)if(String(rows[q][c]||'').trim()){cols.push(c);break}
    it.cols=cols;const n=it.b-it.a+1;let segs=[];
    if(!o.span){for(let c=0;c<W;c++)segs.push(mk(c,1,true));it.kind=cols.length>=2?(n>4?'tbl':'cards'):'par'}
    else if(cols.length===1){const c=cols[0];let txt='';for(let q=it.a;q<=it.b&&!txt;q++)txt=String(rows[q][c]||'').trim();
      const short=n===1&&txt.length<=40&&!/\n/.test(txt);it.kind=short?'sec':'par';
      segs.push(mk(c,short?Math.min(o.hdr||3,W-c):W-c,true))}
    else{it.kind=n>4?'tbl':'cards';
      cols.forEach((c,i)=>{const span=i<cols.length-1?Math.min(cols[i+1]-c,6):Math.min(W-c,3);segs.push(mk(c,span,true))})}
    // заполнители пустот
    if(o.span){const f=[];let pos=0;segs.forEach(s=>{if(s.c>pos)f.push(mk(pos,s.c-pos,false));f.push(s);pos=s.c+s.span});if(pos<W)f.push(mk(pos,W-pos,false));segs=f}
    it.segs=segs});
  const slotKey=(txt,row,c)=>{txt=String(txt).replace(/\s+/g,' ').trim();return txt.length>60?'r'+(row+1)+'_'+colL(c):keyOf(txt)};
  const okName=t=>isTxt(t)&&t.trim()!=='-'&&t.trim()!=='?'&&!(o.excl&&o.excl.test(t.trim()));
  items.forEach((it,k)=>{if(it.t!=='g')return;
    const prev=items[k-1]&&items[k-1].t==='b'?items[k-1]:null,next=items[k+1]&&items[k+1].t==='b'?items[k+1]:null;
    it.slots=[];it.anchor=null;
    if(it.L>=(o.bandMin||99)){it.band={key:'r'+(it.a+1),ctx:prev?firstTxt(rows[prev.b]):''};return}
    const add=(blk,rowIdx,cols)=>{cols.forEach(c=>{const t=rows[rowIdx][c];if(okName(t||''))it.slots.push({c,key:slotKey(t,rowIdx,c),ctx:firstTxt(rows[rowIdx])})});it.anchor=blk};
    if(o.mode==='between'){
      if(prev&&next&&prev.a===prev.b&&prev.cols.length>=2&&it.L>=2&&it.L<=6)add(prev,prev.a,prev.cols);
      else if(prev&&next&&o.extra&&prev.a+1>=o.extra.from&&prev.a+1<=o.extra.to&&it.L>=2&&it.L<=6)add(prev,prev.a,prev.cols.filter(c=>o.extra.cols.includes(c)))}
    else if(o.mode==='below'){
      if(prev&&it.L>=o.min&&prev.a>=(o.firstRow||0)-1&&prev.b-prev.a<=6){
        prev.cols.forEach(c=>{let t='';for(let q=prev.a;q<=prev.b;q++){const x=String(rows[q][c]||'').trim();if(x&&okName(x)){t=x;break}}
          if(t&&!/^ПМК$/i.test(t)&&!(c>=14&&NAVEQ[navNorm(t)]))it.slots.push({c,key:slotKey(t,prev.a,c),ctx:firstTxt(rows[prev.a])})});it.anchor=prev}}
    else if(o.mode==='above'){
      if(next&&it.L>=2&&next.b-next.a<=3)add(next,next.a,next.cols.filter(c=>!o.cols||o.cols.includes(c)))}
    if(!it.slots.length)it.anchor=null});
  return{W,items}}

    const body=cls==='shop'?nm+sl+pr+ds:sl+(cd.tag?'<span class="etag">ПМК</span>':'')+nm+ds;

  const title=(b,k)=>eqChip(rows,b)||(b.cols.length===1&&b.a===b.b&&it[k+1]&&it[k+1].t==='g'&&it[k+1].L>=2&&it[k+1].L<=3);
  for(let k=0;k<it.length;k++){const b=it[k];
    if(b.t!=='b'||b.a<(o.firstRow||0)-1||title(b,k))continue;
    const blocks=[b];let kk=k;
    while(it[kk+1]&&it[kk+1].t==='g'&&it[kk+1].L===1&&it[kk+2]&&it[kk+2].t==='b'&&!title(it[kk+2],kk+2)){blocks.push(it[kk+2]);kk+=2}
    const cs=[...new Set(blocks.flatMap(x=>x.cols))].sort((a,c)=>a-c);
    const cards=cs.map(c=>{const names=[],desc=[];let row=-1;
      blocks.forEach((bl,bi)=>{const cells=[];for(let q=bl.a;q<=bl.b;q++){const t=TT(rows,q,c);if(t){cells.push(t);if(row<0)row=q}}
        if(!cells.length)return;
        if(blocks.length>1){(bi===0?names:desc).push(...cells)}
        else if(cells.length>1){names.push(...cells.slice(0,-1));desc.push(cells[cells.length-1])}
        else names.push(cells[0])});
      const tag=names.some(n=>/^ПМК$/i.test(n)),nm=names.filter(n=>!/^ПМК$/i.test(n));
      const first=nm[0]||desc[0]||'';
      return{idx:gpos(c),row,names:nm,desc,tag,key:first?skey(first,row,c):''}}).filter(cd=>cd.row>=0);
    if(cards.length)G.set(k,{kk,html:cardsH(cards,'eq',o.f)});
    k=kk}
  return G}

// Что скупать: название, картинка, цена, описание
function shopGroups(rows,P,o){const it=P.items,G=new Map();
  for(let k=0;k+2<it.length;k++){const b=it[k],g=it[k+1],d=it[k+2];
    if(b.t!=='b'||g.t!=='g'||d.t!=='b'||b.a!==b.b||g.L<2||g.L>6||d.b-d.a>3)continue;
    if(!(b.cols.length>=2||d.b>d.a))continue;
    const nameCols=b.cols.filter(c=>!isNum(TT(rows,b.a,c)));
    if(!nameCols.length)continue;
    let ok=false;for(let q=d.a;q<=d.b;q++)if(nameCols.some(c=>TT(rows,q,c)))ok=true;
    if(!ok)continue;
    const qty={};nameCols.forEach(c=>{if(isNum(TT(rows,b.a,c+1))&&!nameCols.includes(c+1))qty[c]=TT(rows,b.a,c+1)});
    const skip=new Set(Object.keys(qty).map(c=>+c+1));
    const cs=new Set(b.cols);for(let q=d.a;q<=d.b;q++)rows[q].forEach((t,c)=>{if(String(t).trim())cs.add(c)});
    const cards=[...cs].filter(c=>!skip.has(c)).sort((a,c)=>a-c).map(c=>{
      const nmT=TT(rows,b.a,c);let price='';const desc=[];
      for(let q=d.a;q<=d.b;q++){const t=TT(rows,q,c);if(!t)continue;
        if(d.b>d.a?q===d.a:isNum(t))price+=(price?' ':'')+t;else desc.push(t)}
      return{idx:gpos(c),row:b.a,names:nmT?[nmT]:[],desc,price,qty:qty[c]||'',key:nmT&&!isNum(nmT)?skey(nmT,b.a,c):''}}).filter(cd=>cd.names.length||cd.desc.length||cd.price);
    if(cards.length){G.set(k,{kk:k+2,html:cardsH(cards,'shop',o.f)});k+=2}}
  return G}

function blockH(it,rows,o){let h='';
  for(let q=it.a;q<=it.b;q++){const row=rows[q];
    const ne=row.filter(c=>String(c).trim());const nums=ne.filter(isNum).length;
    const hdRow=it.kind==='tbl'&&ne.length>1&&nums===0&&q<it.b&&rows[q+1].some(c=>isNum(c));
    h+='<tr data-r="'+(q+1)+'">';
    it.segs.forEach(sg=>{
      const txt=sg.own?String(row[sg.c]||'').trim():'';
      const cs=sg.span>1?' colspan="'+sg.span+'"':'';
      if(!txt){h+='<td'+cs+'></td>';return}
      let cls;
      if(it.kind==='sec')cls='sec';
      else if(it.kind==='par')cls='par'+(o.hdr>50&&sg.c===0&&(q===0||(txt.length<=60&&!/\n/.test(txt)&&it.a===it.b))?' big':'');
      else{cls='f';if(isNum(txt))cls+=' num';else if(it.kind==='cards'&&q===it.a&&ne.length>1&&it.b>it.a)cls+=' nm';
        if(it.kind==='tbl')cls+=' tbl';if(hdRow)cls+=' th'}
      let inner;
      if(o.nav==='equip'&&sg.c>=14&&NAVEQ[navNorm(txt)])inner='<a class="nl" data-go="'+NAVEQ[navNorm(txt)]+'">'+esc(txt.replace(/-\n/g,'').replace(/\n/g,' '))+'</a>';
      else inner=cell(txt);
      if(it.kind==='par')inner='<div class="pw">'+inner+'</div>';
      h+='<td class="'+cls+'"'+cs+'>'+inner+'</td>'});
    h+='</tr>'}
  return h}

// Хороший ли корабль: цветная таблица статов с иконками
function goodTable(rows,hr,hend,o){
  const hc=[];rows[hr].forEach((t,c)=>{if(String(t).trim())hc.push(c)});
  let lc=-1;for(let q=hr+1;q<=hend;q++)for(let c=0;c<hc[0];c++)if(TT(rows,q,c)&&lc<0)lc=c;
  if(lc<0)lc=0;
  const COL=['#c0463a','#8057b0','#a97fdc','#b4502f','#b8862b','#c4a888','#4a93b8'];
  let h='<div class="gst" data-r="'+(hr+1)+'"><table><thead><tr><th class="gl"></th>'+hc.map((c,i)=>'<th style="background:'+COL[i%7]+'">'+slotH(o.f,'class_'+keyOf(TT(rows,hr,c).split('\n')[0]),{h:44})+'<div>'+nl2(TT(rows,hr,c))+'</div></th>').join('')+'</tr></thead><tbody>';
  for(let q=hr+1;q<=hend;q++){const lab=TT(rows,q,lc);if(!lab)continue;
    const vals=hc.map(c=>TT(rows,q,c));const only=vals.filter(Boolean).length;
    h+='<tr data-r="'+(q+1)+'"><td class="gl">'+slotH(o.f,'stat_'+keyOf(lab),{h:36})+'<b>'+esc(lab)+'</b></td>';
    if(only===1&&vals[0])h+='<td colspan="'+hc.length+'" class="gm">'+nl2(vals[0])+'</td>';
    else h+=vals.map((t,i)=>'<td style="background:'+COL[i%7]+'">'+nl2(t)+'</td>').join('');
    h+='</tr>'}
  return h+'</tbody></table></div>'}

function renderHybrid(s,v,o){
  const rows=trim(s.rows);let chips='';
  if(o.nav==='equip'){NAVEQ=buildEquipNav(rows);chips=chipsH(equipChips(rows))}
  const P=planGrid(rows,o),W=P.W,it=P.items;
  const G=o.f==='shop'?shopGroups(rows,P,o):(o.f==='equip'?equipGroups(rows,P,o):new Map());
  let hr=-1,hend=-1;
  if(o.f==='goodship'){
    for(let q=0;q<rows.length;q++){if(rows[q].filter(c=>String(c).trim()).length>=6&&rows[q].some(c=>/Эсминцы/.test(c))){hr=q;break}}
    if(hr>=0){hend=hr;for(let q=hr+1;q<rows.length;q++){if(rows[q].some(c=>String(c).trim()==='LCK')){hend=q;break}}}}
  const open='<table><colgroup>'+'<col style="width:64px">'.repeat(W)+'</colgroup><tbody>';
  let h=chips+'<div class="sheet g cv">'+(o.f==='equip'?'<div class="eqax"><div class="eqc">ДЛЯ ПОНИМАНИЯ РАСПОЛОЖЕНИЯ</div><div class="eqr">'+slotH('equip','arrow_right',{h:90})+'<b>УМЕНЬШЕНИЕ УНИВЕРСАЛЬНОСТИ</b></div><div class="eqd">'+slotH('equip','arrow_down',{h:170})+'<b>УМЕНЬШЕНИЕ ЭФФЕКТИВНОСТИ</b></div></div>':''),inT=false,doneT=false;
  const tab=x=>{if(!inT){h+=open;inT=true}h+=x};
  const out=x=>{if(inT){h+='</tbody></table>';inT=false}h+=x};
  for(let k=0;k<it.length;k++){const x=it[k];
    if(hr>=0&&x.b>=hr&&x.a<=hend){if(!doneT){doneT=true;out(goodTable(rows,hr,hend,o))}continue}
    if(G.has(k)){const g=G.get(k);out(g.html);k=g.kk;continue}
    if(x.t==='g'){
      if(x.band){out('<div class="bandw" data-r="'+(x.a+1)+'">'+slotH(o.f,x.band.key,{band:1})+'</div>');continue}
      if(o.f==='equip'&&G.has(k+1))continue;
      tab('<tr class="sp"><td colspan="'+W+'" style="height:'+Math.min(x.L,3)*7+'px"></td></tr>');continue}
    if(o.f==='equip'&&eqChip(rows,x)){
      const ts=[];for(let q=x.a;q<=x.b;q++)x.cols.forEach(c=>{const t=TT(rows,q,c);if(t&&c<14)ts.push(t.replace(/\s+/g,' '))});
      out('<div class="shsec" data-r="'+(x.a+1)+'"><h3>'+esc(ts.join(' · '))+'</h3></div>');continue}
    if(o.f==='shop'&&x.kind==='sec'){
      let t='';for(let c=0;c<W&&!t;c++)t=TT(rows,x.a,c);
      out('<div class="shsec" data-r="'+(x.a+1)+'">'+slotH(o.f,keyOf(t)+'_icon',{h:56})+'<h3>'+esc(t)+'</h3>'+slotH(o.f,keyOf(t)+'_banner',{h:56})+'</div>');continue}
    tab(blockH(x,rows,o))}
  if(inT)h+='</tbody></table>';
  v.innerHTML=h+'</div>'}

// Прототипы: слева портрет, справа шапка (имя, нация, тип, номер) и описание
function renderProto(s,v,o){
  const rows=s.rows.map(r=>r.some(c=>String(c).trim()==='ИмяКорабля')?[]:r);
  const pc=(nm,num,ds,q)=>{const key=keyOf(nm.split('\n')[0]);
    return '<div class="pcard" data-r="'+(q+1)+'"><div class="pface">'+slotH(o.f,key,{h:150})+'</div><div class="pbody"><div class="phd"><b>'+esc(nm)+'</b>'+slotH(o.f,key+'_nation',{h:30})+slotH(o.f,key+'_type',{h:30})+(num?'<span class="pn">'+esc(num)+'</span>':'')+'</div><div class="pds">'+nl2(ds)+'</div></div></div>'};
  let h='<div class="sheet cv"><div class="pgrid">',ser=1,gap=99,titled=false,started=false;
  const banner=q=>{h+='<div class="pser" data-r="'+(q+1)+'">'+slotH(o.f,'series_'+(ser++),{band:1})+'</div>'};
  for(let q=0;q<rows.length;q++){const r=rows[q];
    const ne=r.filter(c=>String(c).trim());
    if(!ne.length){gap++;continue}
    if(ne.length===1&&TT(rows,q,0)&&!titled){h+='<h1 class="ptitle" data-r="'+(q+1)+'">'+esc(TT(rows,q,0))+'</h1>';titled=true;gap=0;continue}
    const cl=(qq,f)=>{const a=[];(rows[qq]||[]).forEach((t,c)=>{t=String(t).trim();if(t&&f(t))a.push([c,t])});return a};
    const isN=t=>isNum(t)||t==='-';
    const side=(arr,lim)=>{const o2=[null,null];if(arr.length>=2){o2[0]=arr[0][1];o2[1]=arr[1][1]}else if(arr.length===1){o2[arr[0][0]>=lim?1:0]=arr[0][1]}return o2};
    const nmA=side(cl(q,t=>!isN(t)),9),dsA=side(cl(q+1,()=>true),9),nuA=side(cl(q,isN),12);
    const L={n:nmA[0],u:nuA[0],d:dsA[0]},R={n:nmA[1],u:nuA[1],d:dsA[1]};
    const lo=L.n&&L.d,ro=R.n&&R.d;
    if(lo||ro){
      if(!started||gap>=5){banner(q);started=true}
      h+=lo?pc(L.n,L.u,L.d,q):'<div></div>';
      h+=ro?pc(R.n,R.u,R.d,q):'<div></div>';
      q++;gap=0;continue}
    gap=0}
  v.innerHTML=h+'</div></div>'}

function renderGrid(s,v,o){if(o.f==='proto')renderProto(s,v,o);else renderHybrid(s,v,o)}

// ===== «Хороший ли корабль?»: белый блок как в оригинале + остальная сетка ниже =====
function goodship(s,v,o){
  const rows=trim(s.rows);
  const find=re=>rows.findIndex(r=>re.test(String(r[0]||'').trim()));
  const iA=find(/^Атакующие/),iB=find(/^Статы выжив/),iC=find(/^Статы пво/);
  const iH=rows.findIndex(r=>r.some(c=>String(c).trim()==='Линкоры'));
  if(iA<0||iB<0||iC<0||iH<0){renderGrid(s,v,o);return}
  const iT=find(/^Я не собираюсь/),iU=find(/^Теперь разберем/);
  const NOTE=32;
  const heads=[];rows[iH].forEach((t,c)=>{t=String(t).trim();if(t&&c<NOTE)heads.push({c,t})});
  let h='<div class="gw">';
  let first=true;
  for(let r=0;r<iH;r++){const t=String(rows[r][0]||'').trim();if(!t)continue;
    if(first){h+='<h1 data-r="'+(r+1)+'">'+esc(t)+'</h1>';first=false}else h+='<p data-r="'+(r+1)+'">'+esc(t)+'</p>'}
  h+='<table><colgroup><col style="width:15%">'+heads.map(()=>'<col>').join('')+'<col style="width:34%"></colgroup>';
  h+='<tr class="hr" data-r="'+(iH+1)+'"><td class="lb"></td>'+heads.map(x=>'<td class="hd">'+esc(x.t.split('\n')[0])+slotH('goodship','class_'+keyOf(x.t.split('\n')[0]),{h:30})+'</td>').join('')+'<td style="border:0"></td></tr>';
  const note=(a,b)=>{const out=[];for(let r=a;r<b;r++){const t=(rows[r]||[]).filter((c,i)=>i>=NOTE&&String(c).trim()).map(c=>String(c)).join('').trim();if(t)out.push(t)}return out.join('\n')};
  [[iA,iB],[iB,iC],[iC,iC+3]].forEach(([a,b])=>{
    const lab=String(rows[a][0]||'').trim();
    h+='<tr data-r="'+(a+1)+'"><td class="lb">'+esc(lab)+'</td>';
    heads.forEach(x=>{let txt='';const cs=[];rows[a].forEach((t,c)=>{if(c>0&&c<NOTE&&String(t).trim())cs.push(c)});
      const hi=heads.indexOf(x);const nxt=heads[hi+1]?heads[hi+1].c:NOTE;
      const c=cs.find(c=>c>=x.c&&c<nxt);txt=c!==undefined?String(rows[a][c]).trim():'';
      h+='<td><div class="gc"><div class="gi">'+slotH('goodship','stat_'+keyOf(lab)+'_'+keyOf(x.t.split('\n')[0]),{h:90})+'</div><div class="gt'+(txt.length>5?' sm':'')+'">'+esc(txt)+'</div></div></td>'});
    h+='<td class="nt">'+esc(note(a,b))+'</td></tr>'});
  h+='</table>';
  if(iT>=0)h+='<p data-r="'+(iT+1)+'">'+esc(String(rows[iT][0]).trim())+'</p>';
  h+='</div>';
  const rest=rows.slice(iU>=0?iU:(iT>=0?iT+1:iC+3));
  const tmp=document.createElement('div');
  renderGrid({name:s.name,rows:rest},tmp,o);
  v.innerHTML='<div class="scr">'+h+'<div class="gr">'+tmp.innerHTML+'</div></div>'}

function raw(s,v){
  let h='<div class="raw"><table>';
  s.rows.forEach((row,i)=>{h+='<tr data-r="'+(i+1)+'">'+row.map(c=>'<td>'+cell(c)+'</td>').join('')+'</tr>'});

function goRow(n,words){let el=null;for(let k=n;k<n+80&&!el;k++)el=VIEW.querySelector('[data-r="'+k+'"]');
  if(!el)return;el.scrollIntoView({block:'start',behavior:'smooth'});flash(el);if(words)markWords(el,words)}
function clearMarks(){document.querySelectorAll('mark.hit').forEach(m=>{m.replaceWith(document.createTextNode(m.textContent))});VIEW.normalize()}
function markWords(el,words){
  const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]')).join('|')+')','gi');
  const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];while(tw.nextNode())nodes.push(tw.currentNode);
  nodes.forEach(n=>{if(!re.test(n.nodeValue)){re.lastIndex=0;return}re.lastIndex=0;
    const sp=document.createElement('span');sp.innerHTML=esc(n.nodeValue).replace(re,'<mark class="hit">$1</mark>');n.replaceWith(...sp.childNodes)})}
VIEW.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();goRow(+a.dataset.go)}});

// ================= ГЛОБАЛЬНЫЙ ПОИСК =================
const IDX=[];
SHEETS.forEach((s,i)=>s.rows.forEach((row,r)=>{const cells=row.map(c=>String(c).trim()).filter(Boolean);if(!cells.length)return;IDX.push({i,r:r+1,cells,l:nrm(cells.join(' \u2022 '))})}));
let SEL=-1,HITS=[];
function search(q){
  const words=nrm(q).split(/\s+/).filter(w=>w.length>0);const box=$('sr');
  if(!words.length||nrm(q).trim().length<2){box.classList.remove('on');HITS=[];return}
  const all=IDX.filter(x=>words.every(w=>x.l.includes(w)));HITS=all.slice(0,120);SEL=-1;
  const byS={};all.forEach(x=>byS[x.i]=(byS[x.i]||0)+1);
  let h='<div class="cnt">Найдено: '+all.length+(all.length>120?' (показаны первые 120)':'')+' · '+Object.keys(byS).map(i=>esc((CFG[SHEETS[i].name]||[SHEETS[i].name])[0])+' '+byS[i]).join(' · ')+'</div>';
  const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]')).join('|')+')','gi');
  HITS.forEach((x,k)=>{let c=x.cells.find(t=>nrm(t).includes(words[0]))||x.cells[0];c=c.replace(/\s+/g,' ');
    const p=nrm(c).indexOf(words[0]);const st=Math.max(0,p-50);let sn=c.slice(st,st+170);if(st>0)sn='…'+sn;if(st+170<c.length)sn+='…';
    h+='<div class="sri" data-k="'+k+'"><b>'+esc((CFG[SHEETS[x.i].name]||[SHEETS[x.i].name])[0])+'</b> <small>· строка '+x.r+'</small><br>'+esc(sn).replace(re,'<mark>$1</mark>')+'</div>'});
  if(!all.length)h+='<div class="sri">Ничего не найдено</div>';
  box.innerHTML=h;box.classList.add('on');box._w=words}
function openHit(k){const x=HITS[k];if(!x)return;const words=$('sr')._w;$('sr').classList.remove('on');
  clearMarks();if(CUR!==x.i)show(x.i);setTimeout(()=>goRow(x.r,words),30)}
$('gs').addEventListener('input',e=>search(e.target.value));
$('gs').addEventListener('focus',e=>{if(e.target.value.length>1)search(e.target.value)});
$('gs').addEventListener('keydown',e=>{const it=[...document.querySelectorAll('#sr .sri[data-k]')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();SEL=Math.max(0,Math.min(it.length-1,SEL+(e.key==='ArrowDown'?1:-1)));it.forEach((x,k)=>x.classList.toggle('sel',k==SEL));if(it[SEL])it[SEL].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter')openHit(Math.max(0,SEL));else if(e.key==='Escape'){$('sr').classList.remove('on');e.target.blur()}});
$('sr').addEventListener('mousedown',e=>{const a=e.target.closest('.sri[data-k]');if(a){e.preventDefault();openHit(+a.dataset.k)}});
document.addEventListener('click',e=>{if(!e.target.closest('.gs'))$('sr').classList.remove('on')});
document.addEventListener('keydown',e=>{if((e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))||(e.ctrlKey&&e.key.toLowerCase()==='k')){e.preventDefault();$('gs').focus();$('gs').select()}});

// ================= СПИСОК КАРТИНОК (slots.txt) =================
function slotsOf(i){
  const s=SHEETS[i],c=CFG[s.name];if(!c||!s.rows.length)return[];const o=c[4],t=c[2],out=[];
  const add=(f,k,ctx,x)=>out.push(['images/'+f+'/'+k+'.'+(x||'png'),ctx||'']);
  if(t==='grid'){const rows=trim(s.rows);if(o.nav==='equip')NAVEQ=buildEquipNav(rows);
    const tmp=document.createElement('div');renderGrid(s,tmp,o);tmp.querySelectorAll('.slot').forEach(e=>{const r=e.closest('[data-r]');add(e.dataset.f,e.dataset.k,r?'строка '+r.dataset.r:'')});
    [].forEach(it=>{if(it.t!=='g')return;
      if(it.band)add(o.f,it.band.key,'строка '+(it.a+1)+', после: «'+it.band.ctx+'» (широкая картинка)');
      it.slots.forEach(x=>add(o.f,x.key,'строка '+(it.a+1)+': '+x.ctx))})}
  else if(t==='doc'){const rows=trim(s.rows);if(o.f==='fleet')rows.forEach((r,k)=>{const nm=String(r[0]||'').trim();if(nm&&nm.length<=40&&r.slice(1).filter(c=>String(c).trim()).length>=1&&r.filter(c=>String(c).trim()).length>1)add('fleet',keyOf(nm.split('\n')[0]),'корабль, строка '+(k+1))});for(let r=0;r<rows.length;r++){if(isBlankRow(rows[r])){let j=r;while(j<rows.length&&isBlankRow(rows[j]))j++;
      if(j-r>=(o.f==='fleet'?2:5)&&j<rows.length)add(o.f,'r'+(r+1),'строка '+(r+1)+', после: «'+firstTxt(rows[r-1]||[])+'» (широкая картинка)');r=j-1}}}
  else if(t==='home'){add('cover','event','картинка актуального ивента');add('cover','oc','картинка ОС');add('cover','meta','картинка Meta')}
  else if(t==='classes'){s.rows.forEach((r,k)=>{if(String(r[1]||'').trim())add(o.f,keyOf(r[1]),'строка '+(k+1)+': '+firstTxt(r))})}
  else if(t==='sheet'){const rows=trim(s.rows);
    if(s.name==='Барражи')rows.forEach((r,k)=>{if(k>1&&String(r[1]||'').trim()&&!String(r[1]).startsWith('Эсминцы |')){const n=keyOf(r[1]);add('faces',n,'лицо корабля, строка '+(k+1));add('barrages',n,'гифка барража, строка '+(k+1),'gif')}});
    else if(o.slot)rows.forEach((r,k)=>{if(k>=o.slot.from&&String(r[o.slot.name]||'').trim()&&!String(r[o.slot.col]||'').trim())add(o.f,keyOf(String(r[o.slot.name]).split('\n')[0]),'строка '+(k+1))})}
  return out}
function slotsText(){
  let txt='СПИСОК МЕСТ ПОД КАРТИНКИ\nПоложите файл по указанному пути (рядом с index.html). Расширения: png, jpg, webp или gif — подойдёт любое.\nНазвание файла = текст из ячейки без символов \\ / : * ? " < > |\nКарточка/слот, для которого файла нет, остаётся пунктирной рамкой.\n';
  SHEETS.forEach((s,i)=>{const L=slotsOf(i);if(!L.length)return;const seen=new Set();
    txt+='\n=== '+(CFG[s.name]||[s.name])[0]+' ('+L.length+') ===\n';
    L.forEach(([p,c])=>{if(seen.has(p))return;seen.add(p);txt+=p+'    // '+c+'\n'})});
  return txt}
function downloadSlots(){const txt=slotsText();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download='slots.txt';a.click()}
$('slotsBtn').onclick=downloadSlots;

// ================= СТАРТ =================
const N=$('nav');
SHEETS.forEach((s,i)=>{const c=CFG[s.name]||[s.name,'•'],b=document.createElement('button');b.innerHTML='<span>'+c[1]+'</span>'+esc(c[0]);b.onclick=()=>show(i);N.appendChild(b)});
show(+location.hash.slice(1)||0);

</script></body></html>
