.eff-col:nth-child(5){--eff-color:#ab7b2c}
.eff-col:nth-child(6){--eff-color:#bca080}

.meow-page{max-width:1600px;margin:auto;color:var(--tx)}
.meow-page h1{font-size:var(--meow-title);font-weight:400;margin:0 0 20px}
.meow-page h2{font-size:var(--meow-heading);line-height:1.2;color:var(--ac);margin:30px 0 12px}
.meow-page p{font-size:var(--meow-text);line-height:1.4;white-space:pre-wrap;margin:8px 0}
.meow-text{display:flex;gap:18px;align-items:flex-start;margin:16px 0}.meow-text p{flex:1;min-width:0}

.meow-talents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.meow-talent{display:flex;align-items:center;gap:10px;min-height:63px;padding:5px;background:var(--card)}.meow-talent p{font-size:16px;margin:0}

.meow-method{display:flex;align-items:stretch;gap:22px;margin:14px 0;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:12px}.meow-method-main{flex:2;min-width:0}.meow-method-main>strong{color:#fff;font-size:var(--meow-text);line-height:1.35}.meow-method-notes{flex:1;min-width:0;border-left:1px solid var(--line);padding-left:20px}.meow-method p{font-size:18px;line-height:1.55;margin:8px 0}.meow-method-notes strong{color:#fff}

/* Страница магазинов: как остальные разделы сайта, без копирования таблицы. */
.shop-page{max-width:1600px;margin:0 auto;padding:14px 12px 50px;color:var(--tx)}

.shop-card-archive-banner{margin:auto -14px -14px;padding-top:10px}.shop-card-archive-banner .slot,.shop-card-archive-banner .slot.ok{width:100%;height:auto;min-height:0!important;aspect-ratio:681 / 250;border-radius:0 0 9px 9px}.shop-card-archive-banner .slot img{width:100%;height:100%;object-fit:cover;border-radius:0 0 9px 9px}@media(max-width:600px){.shop-card-archive-banner{margin-left:-11px;margin-right:-11px;margin-bottom:-11px}}
.shop-campaign-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1100px}.shop-campaign-item{min-width:0;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:10px}.shop-campaign-item h3{font-size:15px;margin:0 0 10px}.shop-campaign-item .slot{min-height:260px}.shop-campaign-item .slot.ok{height:auto;overflow:visible}.shop-campaign-item .slot img{display:block;width:100%;max-width:100%;max-height:none;height:auto}

/* Операция Сирена: отдельная адаптивная раскладка по образцу исходника. */
.os-page{max-width:1600px;margin:0 auto;color:var(--tx)}

.os-title{font-size:clamp(26px,3vw,42px);line-height:1.2;color:var(--ac);margin:34px 0 16px}
.os-row{display:flex;align-items:flex-start;flex-wrap:wrap;gap:14px 20px;padding:14px 16px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;scroll-margin-top:70px}
.os-row.os-paragraph{display:block;background:none;border:0;padding:4px 0}
.os-row.os-heading{display:block;background:none;border:0;padding:0;margin:26px 0 12px;font-size:22px;font-weight:700;color:var(--ac)}
.os-text{flex:1 1 240px;min-width:0;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.os-interface{align-items:center;gap:12px;padding:8px 12px;margin:4px 0}
.os-interface .os-image:has(.slot:is([data-k="os6"],[data-k="os7"],[data-k="os8"],[data-k="os9"],[data-k="os10"])){width:240px;flex:0 1 240px}.os-interface .slot:is([data-k="os6"],[data-k="os7"],[data-k="os8"],[data-k="os9"],[data-k="os10"]).ok{display:flex;align-items:center;justify-content:flex-start}.os-interface .slot:is([data-k="os6"],[data-k="os7"],[data-k="os8"],[data-k="os9"],[data-k="os10"]) img{width:240px;height:80px;max-width:100%;max-height:80px;object-fit:contain;object-position:left center}.os-interface .os-text{flex:1 1 420px;font-size:18px;line-height:1.4}.os-interface .os-text:has(> a:only-child){flex:0 1 240px;font-size:13px;color:var(--ac)}
.os-image{flex:0 1 auto;width:min(100%,var(--os-width,240px));max-width:100%;align-self:flex-start}

.os-settings{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,611px);gap:8px 20px}.os-settings>.os-text{grid-column:1;grid-row:1}.os-settings>.os-image{grid-column:2;grid-row:1;width:100%}.os-settings-note{grid-column:2;grid-row:2;color:var(--tx);font-size:clamp(18px,1.5vw,22px);font-weight:400;line-height:1.5}
@media(max-width:700px){.os-settings{grid-template-columns:minmax(0,1fr)}.os-settings>.os-text{grid-column:1;grid-row:1}.os-settings>.os-image{grid-column:1;grid-row:2}.os-settings-note{grid-column:1;grid-row:3}}
.os-advanced .os-text{font-size:clamp(18px,1.5vw,22px);line-height:1.5}.os-advanced.os-heading .os-text{font-size:clamp(21px,1.8vw,26px)}.os-advanced .os-image{flex-shrink:1}.os-advanced.os-row{align-items:flex-start}
.os-image .slot.ok{display:flex;align-items:center;justify-content:flex-start}
.os-image .slot img{width:auto;height:auto;max-width:100%;max-height:var(--os-height,240px);object-fit:contain}
.os-image:has(.slot:is([data-k="os2"],[data-k="os3"])){width:356px;flex:0 1 356px}.os-image .slot:is([data-k="os2"],[data-k="os3"]).ok{height:156px;display:flex;align-items:center;justify-content:center}.os-image .slot:is([data-k="os2"],[data-k="os3"]) img{width:100%;height:156px;max-height:156px;object-fit:contain}
.os-map{overflow:auto;margin:12px 0 20px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.os-map table{border-collapse:collapse;width:100%;min-width:760px}.os-map td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}.os-map tr:last-child td{border:0}
.os-map .os-map-title td{background:#143329;color:var(--ac);font-weight:700}.os-map .slot{width:175px;height:180px;min-height:180px!important}
.os-map .slot.ok{display:flex;align-items:center;justify-content:center}.os-map .slot img{width:175px;height:180px;object-fit:contain}
.os-shop-table table{table-layout:fixed;min-width:850px}.os-shop-table .slot{width:100%;height:180px;min-height:180px!important}.os-shop-table .slot.ok{justify-content:flex-start}.os-shop-table .slot img{width:auto;max-width:100%;height:auto;max-height:180px;object-fit:contain}.os-map td{width:25%}.os-shop-table td{width:20%;white-space:pre-wrap;line-height:1.5}
.os-detail{margin:12px 0 20px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.os-detail table{width:100%;border-collapse:collapse}.os-detail th,.os-detail td{padding:14px 16px;text-align:left;vertical-align:top}.os-detail th{background:#143329;color:var(--ac);border-bottom:1px solid var(--line)}
.os-detail-content{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-start}
.os-detail-head:has(.slot[data-k="os40"]) .os-image{flex:0 0 106px;width:106px}.os-detail-head:has(.slot[data-k="os40"]) .os-text{flex:0 0 auto}.os-detail-head .os-text{font-weight:700}.os-detail tr{scroll-margin-top:70px}
.os-ports{overflow:auto;margin:12px 0 20px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.os-ports table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:1100px}.os-ports th,.os-ports td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.os-ports th{width:140px;background:#143329;color:var(--ac);font-size:16px;text-align:left}.os-ports td:last-child{border-right:0}.os-ports tr:last-child td{border-bottom:0}.os-ports-images td{height:145px}.os-ports .slot{height:125px;min-height:125px!important}.os-ports .slot.ok{display:flex;align-items:center;justify-content:center}.os-ports .slot img{width:auto;height:auto;max-width:100%;max-height:125px;object-fit:contain}.os-ports tr{scroll-margin-top:70px}

.archive-embed{position:relative;width:100%;height:calc(100vh - 110px);min-height:500px;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.08)}

@media(max-width:700px){.archive-embed{height:calc(100vh - 85px);min-height:360px;border-radius:10px}}
/* Светлая тема использует ту же зелёную палитру и структуру интерфейса. */
:root[data-theme="light"]{color-scheme:light;--bg:#f4f8f5;--side:#edf5f0;--card:#fff;--line:rgba(38,91,63,.18);--ac:#206341;--ac2:#5f9f79;--tx:#182b21;--mut:#557366}
[data-theme="light"] *{scrollbar-color:#8ab99b #e9f2ec}
[data-theme="light"] *::-webkit-scrollbar-track,[data-theme="light"] *::-webkit-scrollbar-corner{background:#e9f2ec}
[data-theme="light"] *::-webkit-scrollbar-thumb{background:#8ab99b;border-color:#e9f2ec}
[data-theme="light"] main{background:radial-gradient(900px 500px at 70% 0,#e2f2e8 0,transparent 70%),var(--bg)}
[data-theme="light"] .brand i,[data-theme="light"] .cardl i{background:#dcefe3}
[data-theme="light"] nav button.on,[data-theme="light"] .dt tr.h td,[data-theme="light"] .sheet tr.hd td:not(.rn),[data-theme="light"] .g td.f.th,[data-theme="light"] .ecard.shop .en,[data-theme="light"] .phd,[data-theme="light"] .os-map .os-map-title td,[data-theme="light"] .os-detail th,[data-theme="light"] .os-ports th{background:#dcefe3}
[data-theme="light"] .sheet tr.pin td{background:#dcefe3!important}
[data-theme="light"] nav button:hover,[data-theme="light"] .sheet tr:hover td:not(.rn){background:rgba(45,122,76,.06)}
[data-theme="light"] .sheet th,[data-theme="light"] .sheet th.rn,[data-theme="light"] .sheet td.rn{background:#e5f1e9}
[data-theme="light"] .top input,[data-theme="light"] .top input#gs,[data-theme="light"] .btn{background-color:#fff}
[data-theme="light"] #sr{background:#fff;box-shadow:0 20px 50px rgba(24,57,38,.18)}
[data-theme="light"] .sri:hover,[data-theme="light"] .sri.sel{background:#e6f3ea}
[data-theme="light"] .hero{background:linear-gradient(120deg,#d3eadb,#eff8f1 60%,#fff)}
[data-theme="light"] .hero:after{color:rgba(32,99,65,.06)}
[data-theme="light"] .hero p,[data-theme="light"] .doc p,[data-theme="light"] .g td.par,[data-theme="light"] .dict .dt tr:not(.h) td:nth-child(3),[data-theme="light"] .dict .dt td:first-child,[data-theme="light"] .ecard .ed,[data-theme="light"] .pds,[data-theme="light"] .sri,[data-theme="light"] .shop-card p{color:#304d3c}
[data-theme="light"] .chips a,[data-theme="light"] a.nl,[data-theme="light"] .shop-nav a,[data-theme="light"] .os-nav a,[data-theme="light"] .g td.f,[data-theme="light"] .ecard,[data-theme="light"] .egrid.eq .ecard,[data-theme="light"] .gst .gl{background:#f0f7f2}
[data-theme="light"] .chips a:hover,[data-theme="light"] a.nl:hover,[data-theme="light"] .shop-nav a:hover,[data-theme="light"] .shop-nav a:focus-visible,[data-theme="light"] .os-nav a:hover{background:#dcefe3}
[data-theme="light"] .g td.sec,[data-theme="light"] .shsec{background:linear-gradient(90deg,#daeee1,transparent)}
[data-theme="light"] .slot{border-color:rgba(40,105,68,.32);background:rgba(51,135,82,.04)}
[data-theme="light"] .slot.ok,[data-theme="light"] .gw .slot.ok{background:none}
[data-theme="light"] .shop-note{background:#e8f4eb;color:#304d3c}
[data-theme="light"] .shop-price{background:#e4f2e8;border-color:var(--line)}
[data-theme="light"] .meow-method-main>strong,[data-theme="light"] .meow-method-notes strong,[data-theme="light"] .meow-text strong[style*="color:#fff"]{color:var(--tx)!important}
.theme-toggle{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--tx)}
.theme-toggle:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  ::view-transition-old(root){animation:none}
  ::view-transition-new(root){animation:theme-reveal 650ms cubic-bezier(.22,1,.36,1) both}

  const mk=(c,span,own)=>({c,span,own});
  items.forEach(it=>{if(it.t!=='b')return;
    const cols=[];for(let c=0;c<W;c++)for(let q=it.a;q<=it.b;q++)if(String(rows[q][c]||'').trim()){cols.push(c);break}
    it.cols=cols;const n=it.b-it.a+1;let segs=[];
    if(!o.span){for(let c=0;c<W;c++)segs.push(mk(c,1,true));it.kind=cols.length>=2?(n>4?'tbl':'cards'):'par'}
    else if(cols.length===1){const c=cols[0];let txt='';for(let q=it.a;q<=it.b&&!txt;q++)txt=String(rows[q][c]||'').trim();
      const short=n===1&&txt.length<=40&&!/\n/.test(txt);it.kind=short?'sec':'par';
      segs.push(mk(c,short?Math.min(o.hdr||3,W-c):W-c,true))}
    else{it.kind=n>4?'tbl':'cards';
      cols.forEach((c,i)=>{const span=i<cols.length-1?Math.min(cols[i+1]-c,6):Math.min(W-c,3);segs.push(mk(c,span,true))})}
    // заполнители пустот
    if(o.span){const f=[];let pos=0;segs.forEach(s=>{if(s.c>pos)f.push(mk(pos,s.c-pos,false));f.push(s);pos=s.c+s.span});if(pos<W)f.push(mk(pos,W-pos,false));segs=f}
    it.segs=segs});
  const slotKey=(txt,row,c)=>{txt=String(txt).replace(/\s+/g,' ').trim();return txt.length>60?'r'+(row+1)+'_'+colL(c):keyOf(txt)};
  const okName=t=>isTxt(t)&&t.trim()!=='-'&&t.trim()!=='?'&&!(o.excl&&o.excl.test(t.trim()));
  items.forEach((it,k)=>{if(it.t!=='g')return;
    const prev=items[k-1]&&items[k-1].t==='b'?items[k-1]:null,next=items[k+1]&&items[k+1].t==='b'?items[k+1]:null;
    it.slots=[];it.anchor=null;
    if(it.L>=(o.bandMin||99)){it.band={key:'r'+(it.a+1),ctx:prev?firstTxt(rows[prev.b]):''};return}
    const add=(blk,rowIdx,cols)=>{cols.forEach(c=>{const t=rows[rowIdx][c];if(okName(t||''))it.slots.push({c,key:slotKey(t,rowIdx,c),ctx:firstTxt(rows[rowIdx])})});it.anchor=blk};
    if(o.mode==='between'){
      if(prev&&next&&prev.a===prev.b&&prev.cols.length>=2&&it.L>=2&&it.L<=6)add(prev,prev.a,prev.cols);
      else if(prev&&next&&o.extra&&prev.a+1>=o.extra.from&&prev.a+1<=o.extra.to&&it.L>=2&&it.L<=6)add(prev,prev.a,prev.cols.filter(c=>o.extra.cols.includes(c)))}
    else if(o.mode==='below'){
      if(prev&&it.L>=o.min&&prev.a>=(o.firstRow||0)-1&&prev.b-prev.a<=6){
        prev.cols.forEach(c=>{let t='';for(let q=prev.a;q<=prev.b;q++){const x=String(rows[q][c]||'').trim();if(x&&okName(x)){t=x;break}}
          if(t&&!/^ПМК$/i.test(t)&&!(c>=14&&NAVEQ[navNorm(t)]))it.slots.push({c,key:slotKey(t,prev.a,c),ctx:firstTxt(rows[prev.a])})});it.anchor=prev}}
    else if(o.mode==='above'){
      if(next&&it.L>=2&&next.b-next.a<=3)add(next,next.a,next.cols.filter(c=>!o.cols||o.cols.includes(c)))}
    if(!it.slots.length)it.anchor=null});
  return{W,items}}

// ===== Карточные раскладки: Эквип / Что скупать / Прототипы / Хороший ли корабль =====
const skey=(txt,row,c)=>{txt=String(txt).replace(/\s+/g,' ').trim();return txt.length>60?'r'+(row+1)+'_'+colL(c):keyOf(txt)};
const gpos=c=>Math.floor((c+1)/3);
const TT=(rows,q,c)=>String((rows[q]||[])[c]||'').trim();
const nl2=t=>esc(t).replace(/\n/g,'<br>');
function eqChip(rows,b){for(let q=b.a;q<=b.b;q++)for(const c of b.cols)if(c>=14&&NAVEQ[navNorm(TT(rows,q,c))])return true;return false}

function cardsH(cards,cls,f){
  const used=new Set();cards.forEach(cd=>{while(used.has(cd.idx))cd.idx++;used.add(cd.idx)});
  const N=Math.max(...cards.map(cd=>cd.idx))+1;
  return (cls==='eq'?'<div class="egrid-scroll">':'')+'<div class="egrid'+(cls==='eq'?' eq':'')+'" data-r="'+(cards[0].row+1)+'" style="--eq-cols:'+N+';grid-template-columns:repeat('+N+',128px)">'+cards.map(cd=>{
    const limitNote=cls==='eq'&&cd.names.some(n=>/^(?:<--|←)\s*лимитк[аи]\s*$/i.test(n.trim()));
    const sl=limitNote?'<div aria-hidden="true" style="height:110px;flex:none"></div>':cd.key?slotH(f,cd.key,{h:cls==='shop'?96:110}):'';
    const nm=cd.names.length?'<div class="en">'+cd.names.map(nl2).join('<br>')+(cd.qty?' <i>×'+esc(cd.qty)+'</i>':'')+'</div>':'';
    const ds=cd.desc.length?'<div class="ed">'+cd.desc.map(nl2).join('<br>')+'</div>':'';
    const pr=cd.price?'<div class="pr">'+nl2(cd.price)+'</div>':'';
    const body=cls==='shop'?nm+sl+pr+ds:sl+(cd.tag?'<span class="etag">ПМК</span>':'')+nm+ds;
    return '<div class="ecard '+cls+'" style="grid-column:'+(cd.idx+1)+'" data-r="'+(cd.row+1)+'">'+body+'</div>'}).join('')+'</div>'+(cls==='eq'?'</div>':'')}

// Эквип: картинка сверху, ниже название, затем описание
function equipGroups(rows,P,o){const it=P.items,G=new Map();
  const title=(b,k)=>eqChip(rows,b)||(b.cols.length===1&&b.a===b.b&&it[k+1]&&it[k+1].t==='g'&&it[k+1].L>=2&&it[k+1].L<=3);
  for(let k=0;k<it.length;k++){const b=it[k];
    if(b.t!=='b'||b.a<(o.firstRow||0)-1||title(b,k))continue;
    const blocks=[b];let kk=k;
    while(it[kk+1]&&it[kk+1].t==='g'&&it[kk+1].L===1&&it[kk+2]&&it[kk+2].t==='b'&&!title(it[kk+2],kk+2)){blocks.push(it[kk+2]);kk+=2}
    const cs=[...new Set(blocks.flatMap(x=>x.cols))].sort((a,c)=>a-c);
    const cards=cs.map(c=>{const names=[],desc=[];let row=-1;
      blocks.forEach((bl,bi)=>{const cells=[];for(let q=bl.a;q<=bl.b;q++){const t=TT(rows,q,c);if(t){cells.push(t);if(row<0)row=q}}
        if(!cells.length)return;
        if(blocks.length>1){(bi===0?names:desc).push(...cells)}
        else if(cells.length>1){names.push(...cells.slice(0,-1));desc.push(cells[cells.length-1])}
        else names.push(cells[0])});
      const tag=names.some(n=>/^ПМК$/i.test(n)),nm=names.filter(n=>!/^ПМК$/i.test(n));
      const first=nm[0]||desc[0]||'';
      return{idx:gpos(c),row,names:nm,desc,tag,key:first?skey(first,row,c):''}}).filter(cd=>cd.row>=0);
    if(cards.length)G.set(k,{kk,html:cardsH(cards,'eq',o.f)});
    k=kk}
  return G}

// Что скупать: название, картинка, цена, описание
function shopGroups(rows,P,o){const it=P.items,G=new Map();
  for(let k=0;k+2<it.length;k++){const b=it[k],g=it[k+1],d=it[k+2];
    if(b.t!=='b'||g.t!=='g'||d.t!=='b'||b.a!==b.b||g.L<2||g.L>6||d.b-d.a>3)continue;
    if(!(b.cols.length>=2||d.b>d.a))continue;
    const nameCols=b.cols.filter(c=>!isNum(TT(rows,b.a,c)));
    if(!nameCols.length)continue;
    let ok=false;for(let q=d.a;q<=d.b;q++)if(nameCols.some(c=>TT(rows,q,c)))ok=true;
    if(!ok)continue;
    const qty={};nameCols.forEach(c=>{if(isNum(TT(rows,b.a,c+1))&&!nameCols.includes(c+1))qty[c]=TT(rows,b.a,c+1)});
    const skip=new Set(Object.keys(qty).map(c=>+c+1));
    const cs=new Set(b.cols);for(let q=d.a;q<=d.b;q++)rows[q].forEach((t,c)=>{if(String(t).trim())cs.add(c)});
    const cards=[...cs].filter(c=>!skip.has(c)).sort((a,c)=>a-c).map(c=>{
      const nmT=TT(rows,b.a,c);let price='';const desc=[];
      for(let q=d.a;q<=d.b;q++){const t=TT(rows,q,c);if(!t)continue;
        if(d.b>d.a?q===d.a:isNum(t))price+=(price?' ':'')+t;else desc.push(t)}
      return{idx:gpos(c),row:b.a,names:nmT?[nmT]:[],desc,price,qty:qty[c]||'',key:nmT&&!isNum(nmT)?skey(nmT,b.a,c):''}}).filter(cd=>cd.names.length||cd.desc.length||cd.price);
    if(cards.length){G.set(k,{kk:k+2,html:cardsH(cards,'shop',o.f)});k+=2}}
  return G}

function blockH(it,rows,o){let h='';
  for(let q=it.a;q<=it.b;q++){const row=rows[q];
    const ne=row.filter(c=>String(c).trim());const nums=ne.filter(isNum).length;
    const hdRow=it.kind==='tbl'&&ne.length>1&&nums===0&&q<it.b&&rows[q+1].some(c=>isNum(c));
    h+='<tr data-r="'+(q+1)+'">';
    it.segs.forEach(sg=>{
      const txt=sg.own?String(row[sg.c]||'').trim():'';
      const cs=sg.span>1?' colspan="'+sg.span+'"':'';
      if(!txt){h+='<td'+cs+'></td>';return}
      let cls;
      if(it.kind==='sec')cls='sec';
      else if(it.kind==='par')cls='par'+(o.hdr>50&&sg.c===0&&(q===0||(txt.length<=60&&!/\n/.test(txt)&&it.a===it.b))?' big':'');
      else{cls='f';if(isNum(txt))cls+=' num';else if(it.kind==='cards'&&q===it.a&&ne.length>1&&it.b>it.a)cls+=' nm';
        if(it.kind==='tbl')cls+=' tbl';if(hdRow)cls+=' th'}
      let inner;
      if(o.nav==='equip'&&sg.c>=14&&NAVEQ[navNorm(txt)])inner='<a class="nl" data-go="'+NAVEQ[navNorm(txt)]+'">'+esc(txt.replace(/-\n/g,'').replace(/\n/g,' '))+'</a>';

  const tab=x=>{if(!inT){h+=open;inT=true}h+=x};

  for(let k=0;k<it.length;k++){const x=it[k];

    tab(blockH(x,rows,o))}
  if(inT)h+='</tbody></table>';

// Прототипы: слева портрет, справа шапка (имя, нация, тип, номер) и описание
function renderProto(s,v,o){
  const rows=s.rows.map(r=>r.some(c=>String(c).trim()==='ИмяКорабля')?[]:r);
  const pc=(nm,num,ds,q)=>{const key=keyOf(nm.split('\n')[0]);
    return '<div class="pcard" data-r="'+(q+1)+'"><div class="pface">'+slotH(o.f,key,{h:150})+'</div><div class="pbody"><div class="phd"><b>'+esc(nm)+'</b>'+slotH(o.f,key+'_nation',{h:30})+slotH(o.f,key+'_type',{h:30})+(num?'<span class="pn">'+esc(num)+'</span>':'')+'</div><div class="pds">'+nl2(ds)+'</div></div></div>'};
  let h='<div class="sheet cv"><div class="pgrid">',ser=1,gap=99,titled=false,started=false;
  const banner=q=>{h+='<div class="pser" data-r="'+(q+1)+'">'+slotH(o.f,'series_'+(ser++),{band:1})+'</div>'};
  for(let q=0;q<rows.length;q++){const r=rows[q];
    const ne=r.filter(c=>String(c).trim());
    if(!ne.length){gap++;continue}
    if(ne.length===1&&TT(rows,q,0)&&!titled){h+='<h1 class="ptitle" data-r="'+(q+1)+'">'+esc(TT(rows,q,0))+'</h1>';titled=true;gap=0;continue}
    const cl=(qq,f)=>{const a=[];(rows[qq]||[]).forEach((t,c)=>{t=String(t).trim();if(t&&f(t))a.push([c,t])});return a};
    const isN=t=>isNum(t)||t==='-';
    const side=(arr,lim)=>{const o2=[null,null];if(arr.length>=2){o2[0]=arr[0][1];o2[1]=arr[1][1]}else if(arr.length===1){o2[arr[0][0]>=lim?1:0]=arr[0][1]}return o2};
    const nmA=side(cl(q,t=>!isN(t)),9),dsA=side(cl(q+1,()=>true),9),nuA=side(cl(q,isN),12);
    const L={n:nmA[0],u:nuA[0],d:dsA[0]},R={n:nmA[1],u:nuA[1],d:dsA[1]};
    const lo=L.n&&L.d,ro=R.n&&R.d;
    if(lo||ro){
      if(!started||gap>=5){banner(q);started=true}
      h+=lo?pc(L.n,L.u,L.d,q):'<div></div>';
      h+=ro?pc(R.n,R.u,R.d,q):'<div></div>';
      q++;gap=0;continue}
    gap=0}
  v.innerHTML=h+'</div></div>'}

// ===== «Хороший ли корабль?»: белый блок как в оригинале + остальная сетка ниже =====
function goodship(s,v,o){
  const rows=trim(s.rows);
  const find=re=>rows.findIndex(r=>re.test(String(r[0]||'').trim()));
  const iA=find(/^Атакующие/),iB=find(/^Статы выжив/),iC=find(/^Статы пво/);
  const iH=rows.findIndex(r=>r.some(c=>String(c).trim()==='Линкоры'));
  if(iA<0||iB<0||iC<0||iH<0){renderGrid(s,v,o);return}
  const iT=find(/^Я не собираюсь/),iU=find(/^Теперь разберем/);
  const NOTE=32;
  const heads=[];rows[iH].forEach((t,c)=>{t=String(t).trim();if(t&&c<NOTE)heads.push({c,t})});
  let h='<div class="gw">';
  let first=true;
  for(let r=0;r<iH;r++){const t=String(rows[r][0]||'').trim();if(!t)continue;
    if(first){h+='<h1 data-r="'+(r+1)+'">'+esc(t)+'</h1>';first=false}else h+='<p data-r="'+(r+1)+'">'+esc(t)+'</p>'}
  h+='<div class="gw-table-scroll"><table><colgroup><col style="width:15%">'+heads.map(()=>'<col>').join('')+'<col style="width:34%"></colgroup>';
  h+='<tr class="hr" data-r="'+(iH+1)+'"><td class="lb"></td>'+heads.map(x=>'<td class="hd">'+esc(x.t.split('\n')[0])+slotH('goodship','class_'+keyOf(x.t.split('\n')[0]),{h:30})+'</td>').join('')+'<td style="border:0"></td></tr>';
  const note=(a,b)=>{const out=[];for(let r=a;r<b;r++){const t=(rows[r]||[]).filter((c,i)=>i>=NOTE&&String(c).trim()).map(c=>String(c)).join('').trim();if(t)out.push(t)}return out.join('\n')};
  [[iA,iB],[iB,iC],[iC,iC+3]].forEach(([a,b])=>{
    const lab=String(rows[a][0]||'').trim();
    h+='<tr data-r="'+(a+1)+'"><td class="lb">'+esc(lab)+'</td>';
    heads.forEach(x=>{let txt='';const cs=[];rows[a].forEach((t,c)=>{if(c>0&&c<NOTE&&String(t).trim())cs.push(c)});
      const hi=heads.indexOf(x);const nxt=heads[hi+1]?heads[hi+1].c:NOTE;
      const c=cs.find(c=>c>=x.c&&c<nxt);txt=c!==undefined?String(rows[a][c]).trim():'';
      h+='<td><div class="gc"><div class="gi">'+slotH('goodship','stat_'+keyOf(lab)+'_'+keyOf(x.t.split('\n')[0]),{h:90})+'</div><div class="gt'+(txt.length>5?' sm':'')+'">'+esc(txt)+'</div></div></td>'});
    h+='<td class="nt">'+esc(note(a,b))+'</td></tr>'});
  h+='</table></div>';
  if(iT>=0)h+='<p data-r="'+(iT+1)+'">'+esc(String(rows[iT][0]).trim())+'</p>';
  h+='</div>';
  const start=iU>=0?iU:(iT>=0?iT+1:iC+3);
  const iEff=rows.findIndex((r,i)=>i>=start&&/^Однако помимо базовых статов/.test(String(r[0]||'').trim()));
  const iEnd=rows.findIndex((r,i)=>i>iEff&&/^Эти слоты также/.test(String(r[0]||'').trim()));
  const iEffHead=rows.findIndex((r,i)=>i>iEff&&String(r[3]||'').trim()==='Линкоры');
  const renderPart=part=>{if(!part.length)return '';const tmp=document.createElement('div');renderGrid({name:s.name,rows:part},tmp,o);return tmp.innerHTML};
  if(iEff<0||iEnd<0||iEffHead<0||iEffHead>=iEnd){
    v.innerHTML='<div class="scr">'+h+'<div class="gr">'+renderPart(rows.slice(start))+'</div></div>';return;
  }
  const cols=[[0,3],[7,10],[14,17],[21,24],[28,31],[35,38],[42,46]];
  let efficiency='<div class="gw"><p data-r="'+(iEff+1)+'">'+esc(rows[iEff][0])+'</p><div class="gw-table-scroll"><div class="eff-grid">';
  cols.forEach(([labelCol,valueCol])=>{
    const name=String(rows[iEffHead][valueCol]||'').trim();
    efficiency+='<div class="eff-col"><div class="eff-head">'+esc(name)+slotH('goodship','class_'+keyOf(name),{h:30})+'</div><div class="eff-items">';
    for(let r=iEffHead+1;r<iEnd;r++){
      const label=String(rows[r][labelCol]||'').trim(),value=String(rows[r][valueCol]||'').trim();
      if(label||value)efficiency+='<div class="eff-item" data-r="'+(r+1)+'"><div class="eff-label">'+esc(label)+'</div><div class="eff-value">'+esc(value)+'</div></div>';
    }
    efficiency+='</div></div>';
  });
  const renderTail=()=>{
    const tmp=document.createElement('div');
    renderGrid({name:s.name,rows:rows.slice(start)},tmp,o);
    const sheet=tmp.querySelector('.sheet');
    const first=sheet&&sheet.querySelector('[data-r="'+(iEnd-start+1)+'"]');
    if(!first)return renderPart(rows.slice(iEnd));
    const table=first.closest('table');
    const columns=table&&table.querySelector('colgroup');
    const savedColumns=columns&&columns.cloneNode(true);
    const range=document.createRange();range.setStart(sheet,0);range.setEndBefore(first);range.deleteContents();
    if(table&&savedColumns&&!table.querySelector('colgroup'))table.insertBefore(savedColumns,table.firstChild);
    return tmp.innerHTML;
  };
  efficiency+='</div></div></div>';
  v.innerHTML='<div class="scr">'+h+'<div class="gr">'+renderPart(rows.slice(start,iEff))+'</div>'+efficiency+'<div class="gr">'+renderTail()+'</div></div>'}

  const sizes={os1:[152,151],os2:[305,156],os3:[356,156],os4:[203,255],os5:[101,102],os6:[152,82],os7:[152,74],os8:[152,65],os9:[254,84],os10:[152,83],os37:[106,106],os38:[152,258],os39:[509,258],os42:[509,251],os44:[106,106],os45:[968,209],os46:[106,106],os47:[106,106],os101:[968,209],os71:[200,250],os72:[611,188],os73:[509,492],os104:[203,115],os74:[356,119]};

      }

    }
    const portRows={'NY City':3,'Liverpool':3,'Gibraltar':2,'St. Petersburg':3};
    const port=String(row[1]||'').trim(), portCount=portRows[port];

      for(let j=0;j<extra.length;j++){
        const values=extra[j], offset=values[0]?0:1;
        h+='<tr data-r="'+(i+j+2)+'">';

        h+='</tr>';

    if(detailTitle){
      let next=i+1;
      while(next<rows.length && !rows[next].some(x=>String(x||'').trim() && String(x).trim()!=='ㅤ'))next++;

          }
        }
        h+='</tbody></table></div>';i=next;continue;
      }
    }
    if(cells.length===1 && /^(ДЛЯ САМЫХ МАЛЕНЬКИХ|ДЛЯ ТЕХ, КТО ЧУТЬ ПОБОЛЬШЕ|СМЕШАРИК)/i.test(cells[0])){h+='<h2 class="os-title" data-r="'+(i+1)+'">'+cell(cells[0])+'</h2>';continue}
    const textOnly=cells.length===1&&!/^\[img:/.test(cells[0]);

    const interfaceRow=cells.some(x=>/^\[img:os\/os(?:4|5|6|7|8|9|10)\]$/.test(x));

    const shopLink=cells.includes('[img:os/os8]')&&shopRow>=0?'<div class="os-text"><a data-go="'+(shopRow+1)+'" href="#">Я не хочу думать, что купить?</a></div>':'';
    h+='<div class="os-row'+(interfaceRow?' os-interface':'')+(advanced?' os-advanced':'')+(heading?' os-heading':textOnly?' os-paragraph':'')+'" data-r="'+(i+1)+'">'+cells.map(content).join('')+shopLink+'</div>';
  }
  v.innerHTML=h+'</div></div>';
}

function flash(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2600)}
function goRow(n,words){
  let el=VIEW.querySelector('[data-r="'+n+'"]');
  if(!el){
    for(let k=n; k<n+80 && !el; k++) el=VIEW.querySelector('[data-r="'+k+'"]');
  }
  if(!el) return;
  el.scrollIntoView({block:'start',behavior:'smooth'});
  flash(el);
  if(words) markWords(el,words);
}
function clearMarks(){document.querySelectorAll('mark.hit').forEach(m=>{m.replaceWith(document.createTextNode(m.textContent))});VIEW.normalize()}
function markWords(el,words){
  const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]')).join('|')+')','gi');
  const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];while(tw.nextNode())nodes.push(tw.currentNode);
  nodes.forEach(n=>{if(!re.test(n.nodeValue)){re.lastIndex=0;return}re.lastIndex=0;
    const sp=document.createElement('span');sp.innerHTML=esc(n.nodeValue).replace(re,'<mark class="hit">$1</mark>');n.replaceWith(...sp.childNodes)})}
VIEW.addEventListener('click',e=>{const barr=e.target.closest('[data-barr-go]');if(barr){e.preventDefault();const row=VIEW.querySelector('tr[data-r="'+barr.dataset.barrGo+'"]'),sheet=row&&row.closest('.sheet');if(row&&sheet){const header=sheet.querySelector('tr.pin');const offset=header?header.getBoundingClientRect().height:0;sheet.scrollTop+=row.getBoundingClientRect().top-sheet.getBoundingClientRect().top-sheet.clientTop-offset;flash(row)}return}const campaign=e.target.closest('[data-shop-campaign]');if(campaign){e.preventDefault();$('shop-campaign').scrollIntoView({block:'start',behavior:'smooth'});return}const a=e.target.closest('[data-go]');if(a){e.preventDefault();goRow(+a.dataset.go)}});

// ================= ГЛОБАЛЬНЫЙ ПОИСК =================
const IDX=[];
SHEETS.forEach((s,i)=>{if(CFG[s.name]?.[2]==='embed')return;s.rows.forEach((row,r)=>{const cells=row.map(c=>String(c).trim()).filter(Boolean);if(!cells.length)return;IDX.push({i,r:r+1,cells,l:nrm(cells.join(' \u2022 '))})})});
let SEL=-1,HITS=[];
function search(q){
  const words=nrm(q).split(/\s+/).filter(w=>w.length>0);const box=$('sr');
  if(!words.length||nrm(q).trim().length<2){box.classList.remove('on');HITS=[];return}
  const all=IDX.filter(x=>words.every(w=>x.l.includes(w)));HITS=all.slice(0,120);SEL=-1;
  const byS={};all.forEach(x=>byS[x.i]=(byS[x.i]||0)+1);
  let h='<div class="cnt">Найдено: '+all.length+(all.length>120?' (показаны первые 120)':'')+' · '+Object.keys(byS).map(i=>esc((CFG[SHEETS[i].name]||[SHEETS[i].name])[0])+' '+byS[i]).join(' · ')+'</div>';
  const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]')).join('|')+')','gi');
  HITS.forEach((x,k)=>{let c=x.cells.find(t=>nrm(t).includes(words[0]))||x.cells[0];c=c.replace(/\s+/g,' ');
    const p=nrm(c).indexOf(words[0]);const st=Math.max(0,p-50);let sn=c.slice(st,st+170);if(st>0)sn='…'+sn;if(st+170<c.length)sn+='…';
    h+='<div class="sri" data-k="'+k+'"><b>'+esc((CFG[SHEETS[x.i].name]||[SHEETS[x.i].name])[0])+'</b> <small>· строка '+x.r+'</small><br>'+esc(sn).replace(re,'<mark>$1</mark>')+'</div>'});
  if(!all.length)h+='<div class="sri">Ничего не найдено</div>';
  box.innerHTML=h;box.classList.add('on');box._w=words}
function openHit(k){const x=HITS[k];if(!x)return;const words=$('sr')._w;$('sr').classList.remove('on');
  clearMarks();if(CUR!==x.i)show(x.i);setTimeout(()=>goRow(x.r,words),30)}
$('gs').addEventListener('input',e=>search(e.target.value));
$('gs').addEventListener('focus',e=>{if(e.target.value.length>1)search(e.target.value)});
$('gs').addEventListener('keydown',e=>{const it=[...document.querySelectorAll('#sr .sri[data-k]')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();SEL=Math.max(0,Math.min(it.length-1,SEL+(e.key==='ArrowDown'?1:-1)));it.forEach((x,k)=>x.classList.toggle('sel',k==SEL));if(it[SEL])it[SEL].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter')openHit(Math.max(0,SEL));else if(e.key==='Escape'){$('sr').classList.remove('on');e.target.blur()}});
$('sr').addEventListener('mousedown',e=>{const a=e.target.closest('.sri[data-k]');if(a){e.preventDefault();openHit(+a.dataset.k)}});
document.addEventListener('click',e=>{if(!e.target.closest('.gs'))$('sr').classList.remove('on')});
document.addEventListener('keydown',e=>{if((e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))||(e.ctrlKey&&e.key.toLowerCase()==='k')){e.preventDefault();$('gs').focus();$('gs').select()}});

// ================= СПИСОК КАРТИНОК (slots.txt) =================
function slotsOf(i){
  const s=SHEETS[i],c=CFG[s.name];if(!c||!s.rows.length)return[];const o=c[4],t=c[2],out=[];
  const add=(f,k,ctx,x)=>out.push(['images/'+f+'/'+k+'.'+(x||'png'),ctx||'']);
  if(s.name==='Что скупать/фармить'&&window.SHOP_LAYOUT){const tmp=document.createElement('div');renderShopExample(s,tmp);tmp.querySelectorAll('.slot').forEach(e=>{const r=e.closest('[data-r]');add(e.dataset.f,e.dataset.k,r?'строка '+r.dataset.r:'фарм кампании')})}
  else if(t==='grid'){const rows=trim(s.rows);if(o.nav==='equip')NAVEQ=buildEquipNav(rows);
    const tmp=document.createElement('div');renderGrid(s,tmp,o);tmp.querySelectorAll('.slot').forEach(e=>{const r=e.closest('[data-r]');add(e.dataset.f,e.dataset.k,r?'строка '+r.dataset.r:'')});
    [].forEach(it=>{if(it.t!=='g')return;
      if(it.band)add(o.f,it.band.key,'строка '+(it.a+1)+', после: «'+it.band.ctx+'» (широкая картинка)');
      it.slots.forEach(x=>add(o.f,x.key,'строка '+(it.a+1)+': '+x.ctx))})}
  else if(t==='doc'&&o.f==='cats'){const tmp=document.createElement('div');meowficers(s,tmp,o);tmp.querySelectorAll('.slot').forEach(e=>{const r=e.closest('[data-r]');add(e.dataset.f,e.dataset.k,r?'строка '+r.dataset.r:'')})}
  else if(t==='doc'){const rows=trim(s.rows);if(o.f==='fleet')rows.forEach((r,k)=>{const nm=String(r[0]||'').trim();if(nm&&nm.length<=40&&r.slice(1).filter(c=>String(c).trim()).length>=1&&r.filter(c=>String(c).trim()).length>1)add('fleet',keyOf(nm.split('\n')[0]),'корабль, строка '+(k+1))});for(let r=0;r<rows.length;r++){if(isBlankRow(rows[r])){let j=r;while(j<rows.length&&isBlankRow(rows[j]))j++;
      if(j-r>=(o.f==='fleet'?2:5)&&j<rows.length)add(o.f,'r'+(r+1),'строка '+(r+1)+', после: «'+firstTxt(rows[r-1]||[])+'» (широкая картинка)');r=j-1}}}
  else if(t==='home'){add('cover','event','картинка актуального ивента');add('cover','oc','картинка ОС');add('cover','meta','картинка Meta')}
  else if(t==='dict'){const tmp=document.createElement('div');dict(s,tmp);tmp.querySelectorAll('.slot').forEach(e=>{const r=e.closest('[data-r]');add(e.dataset.f,e.dataset.k,r?'строка '+r.dataset.r:'')})}
  else if(t==='classes'){s.rows.forEach((r,k)=>{if(String(r[1]||'').trim())add(o.f,keyOf(r[1]),'строка '+(k+1)+': '+firstTxt(r))})}
  else if(t==='sheet'){const rows=trim(s.rows);
    if(o.f==='cross'){add('cross','cross_fleet','пример кроссфлота');add('cross','os_fleets','основные флоты в ОС')}
    if(s.name==='Барражи')rows.forEach((r,k)=>{if(k>1&&String(r[1]||'').trim()&&!String(r[1]).startsWith('Эсминцы |')){const n=keyOf(r[1]);add('faces',n,'лицо корабля, строка '+(k+1));!String(r[6]||'').trim()&&add('barrages','nogif','заглушка отсутствующей гифки, строка '+(k+1),'gif')}});
    else if(o.slot)rows.forEach((r,k)=>{if(k>=o.slot.from&&String(r[o.slot.name]||'').trim()&&!String(r[o.slot.col]||'').trim())add(o.f,keyOf(String(r[o.slot.name]).split('\n')[0]),'строка '+(k+1))})}
  return out}
function slotsText(){
  let txt='СПИСОК МЕСТ ПОД КАРТИНКИ\nПоложите файл по указанному пути (рядом с index.html). Расширения: png, jpg, webp или gif — подойдёт любое.\nНазвание файла = текст из ячейки без символов \\ / : * ? " < > |\nКарточка/слот, для которого файла нет, остаётся пунктирной рамкой.\n';
  SHEETS.forEach((s,i)=>{const L=slotsOf(i);if(!L.length)return;const seen=new Set();
    txt+='\n=== '+(CFG[s.name]||[s.name])[0]+' ('+L.length+') ===\n';
    L.forEach(([p,c])=>{if(seen.has(p))return;seen.add(p);txt+=p+'    // '+c+'\n'})});
  return txt}
function downloadSlots(){const txt=slotsText();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download='slots.txt';a.click()}


// ================= СТАРТ =================
const N=$('nav');
SHEETS.forEach((s,i)=>{const c=CFG[s.name]||[s.name,'•'],b=document.createElement('button');b.textContent=c[0];b.onclick=()=>show(i);N.appendChild(b)});
show(+location.hash.slice(1)||0);

</script></body></html>
